<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spec-Driven Development — Workshop learning guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<style>
  :root {
    --paper: #ffffff;
    --paper-2: #F5F5F5;
    --paper-3: #E1E1E1;
    --ink: #241F20;
    --ink-2: #4a5464;
    --ink-3: #728197;
    --ink-faint: #9C9C9C;
    --amber: #133EF8;
    --amber-2: #00b2ff;
    --amber-soft: #e8eeff;
    --sage: #00b2ff;
    --sage-soft: #e6f7ff;
    --rust: #FF4550;
    --line: #E1E1E1;
    --line-soft: #F5F5F5;
  }
  html, body {
    background: var(--paper);
    color: var(--ink);
  }
  body {
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse 80% 30% at 80% 0%, rgba(19,62,248,0.06), transparent 60%),
      radial-gradient(ellipse 60% 30% at 0% 100%, rgba(0,178,255,0.05), transparent 60%);
    background-attachment: fixed;
  }
  .display { font-family: "Inter", system-ui, sans-serif; letter-spacing: -0.01em; }
  .display-tight { font-family: "Inter", system-ui, sans-serif; letter-spacing: -0.02em; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  .text-paper { color: var(--paper); }
  .text-ink { color: var(--ink); }
  .text-ink-2 { color: var(--ink-2); }
  .text-ink-3 { color: var(--ink-3); }
  .text-ink-faint { color: var(--ink-faint); }
  .text-amber { color: var(--amber); }
  .text-amber-2 { color: var(--amber-2); }
  .text-sage { color: var(--sage); }
  .text-rust { color: var(--rust); }

  .bg-paper { background: var(--paper); }
  .bg-paper-2 { background: var(--paper-2); }
  .bg-paper-3 { background: var(--paper-3); }
  .bg-amber-soft { background: var(--amber-soft); }
  .bg-sage-soft { background: var(--sage-soft); }
  .bg-ink { background: var(--ink); }
  .border-line { border-color: var(--line); }
  .border-line-soft { border-color: var(--line-soft); }
  .border-amber { border-color: var(--amber); }
  .border-sage { border-color: var(--sage); }
  .ruled { border-bottom: 1px solid var(--line); }

  .underline-amber { text-decoration: underline; text-decoration-color: var(--amber-2); text-decoration-thickness: 2px; text-underline-offset: 6px; }
  .marker-amber {
    background: linear-gradient(180deg, transparent 60%, var(--amber-soft) 60%, var(--amber-soft) 92%, transparent 92%);
    padding: 0 3px;
  }
  .marker-sage {
    background: linear-gradient(180deg, transparent 60%, var(--sage-soft) 60%, var(--sage-soft) 92%, transparent 92%);
    padding: 0 3px;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper-2);
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .chip-amber { border-color: var(--amber); color: var(--amber); background: rgba(19,62,248,0.06); }
  .chip-sage { border-color: var(--sage); color: var(--sage); background: rgba(0,178,255,0.06); }

  .dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-radius: 4px;
    border: 1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    font-weight: 500;
    transition: all 0.15s ease;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn-primary {
    background: var(--ink); border-color: var(--ink); color: var(--paper);
  }
  .btn-primary:hover { background: var(--amber); border-color: var(--amber); color: var(--paper); }

  .codeblock {
    background: var(--ink); color: var(--paper);
    border-radius: 6px; padding: 18px 20px;
    font-family: "JetBrains Mono", monospace; font-size: 13px;
    line-height: 1.7;
    overflow-x: auto;
  }
  .codeblock .cmd { color: var(--amber-soft); }
  .codeblock .ok { color: #b8d4be; }
  .codeblock .warn { color: #e8a86b; }
  .codeblock .dim { color: #8a8472; }
  .codeblock .hl { color: var(--paper); }

  .card {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .card:hover { border-color: var(--ink-3); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(36,31,32,0.06); }
  .card.active { border-color: var(--ink); background: var(--paper); box-shadow: 0 1px 0 var(--ink); transform: none; }


  .stickynav {
    position: fixed; top: 50%; right: 24px; transform: translateY(-50%);
    z-index: 50;
    display: flex; flex-direction: column; gap: 12px;
    padding: 14px 10px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .stickynav a {
    width: 24px; height: 2px; background: var(--ink-faint); display: block;
    transition: all 0.2s ease;
  }
  .stickynav a:hover, .stickynav a.active { width: 40px; background: var(--amber); }
  @media (max-width: 1100px) { .stickynav { display: none; } }

  .tab {
    padding: 10px 18px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-3);
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 14px;
    font-weight: 500;
  }
  .tab:hover { color: var(--ink); border-color: var(--ink-3); }
  .tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  a.tlink { color: var(--amber); border-bottom: 1px dashed var(--amber-2); }
  a.tlink:hover { color: var(--ink); border-bottom-color: var(--ink); }

  .reveal { opacity: 0; transform: translateY(12px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .reveal.show { opacity: 1; transform: none; }

  /* Staggered layer rows — each row slides in with increasing delay */
  .reveal.show .layer-row { opacity: 0; animation: layerSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .reveal.show .layer-row:nth-child(1) { animation-delay: 0.05s; }
  .reveal.show .layer-row:nth-child(2) { animation-delay: 0.10s; }
  .reveal.show .layer-row:nth-child(3) { animation-delay: 0.15s; }
  .reveal.show .layer-row:nth-child(4) { animation-delay: 0.20s; }
  .reveal.show .layer-row:nth-child(5) { animation-delay: 0.25s; }
  .reveal.show .layer-row:nth-child(6) { animation-delay: 0.30s; }
  .reveal.show .layer-row:nth-child(7) { animation-delay: 0.35s; }
  .reveal.show .layer-row:nth-child(8) { animation-delay: 0.40s; }
  @keyframes layerSlideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: none; }
  }


  .codeblock::-webkit-scrollbar { height: 6px; }
  .codeblock::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

  /* Layer pyramid */
  .layer-row {
    display: flex; align-items: center;
    padding: 10px 14px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    margin-bottom: 4px;
    border-radius: 3px;
    transition: all 0.2s ease;
    font-size: 13px;
  }
  .layer-row:hover { border-color: var(--amber); background: var(--paper); }
  .layer-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px;
    background: var(--ink); color: var(--paper);
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 600;
    margin-right: 14px;
    flex-shrink: 0;
  }

  /* Checkpoint flow */
  .checkpoint {
    position: relative;
    padding-left: 28px;
    padding-bottom: 32px;
    border-left: 2px solid var(--line);
  }
  .checkpoint:last-child { border-left: 2px solid transparent; padding-bottom: 0; }
  .checkpoint::before {
    content: "";
    position: absolute;
    left: -8px; top: 4px;
    width: 14px; height: 14px;
    border-radius: 999px;
    background: var(--paper);
    border: 2px solid var(--ink);
  }
  .checkpoint.gate::before { background: var(--amber); border-color: var(--amber); }

  /* Diagonal stripe for "before/after" */
  .stripe-old {
    background-image: repeating-linear-gradient(135deg, var(--paper-2), var(--paper-2) 8px, var(--paper-3) 8px, var(--paper-3) 9px);
  }

  /* Asymmetric drop */
  .drop {
    width: 9px; height: 9px;
    background: var(--amber);
    transform: rotate(45deg);
    display: inline-block;
  }

  /* Checkpoint dot scale-in */
  .reveal.show .checkpoint::before {
    animation: dotBounceIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  .reveal.show .checkpoint:nth-child(1)::before { animation-delay: 0.05s; }
  .reveal.show .checkpoint:nth-child(2)::before { animation-delay: 0.10s; }
  .reveal.show .checkpoint:nth-child(3)::before { animation-delay: 0.15s; }
  .reveal.show .checkpoint:nth-child(4)::before { animation-delay: 0.20s; }
  .reveal.show .checkpoint:nth-child(5)::before { animation-delay: 0.25s; }
  .reveal.show .checkpoint:nth-child(6)::before { animation-delay: 0.30s; }
  .reveal.show .checkpoint:nth-child(7)::before { animation-delay: 0.35s; }
  .reveal.show .checkpoint:nth-child(8)::before { animation-delay: 0.40s; }
  .reveal.show .checkpoint:nth-child(9)::before { animation-delay: 0.45s; }
  .reveal.show .checkpoint:nth-child(10)::before { animation-delay: 0.50s; }
  .reveal.show .checkpoint.gate::before {
    animation: dotBounceInGate 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  @keyframes dotBounceIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  @keyframes dotBounceInGate {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Tab content flip-in */
  @keyframes tabFlipIn {
    from { opacity: 0; transform: perspective(800px) rotateY(-3deg) translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .tab-content-enter {
    animation: tabFlipIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Walkthrough artifact slide-in */
  @keyframes artifactEnter {
    from { opacity: 0; transform: translateX(-16px); }
    to { opacity: 1; transform: none; }
  }
  .walkthrough-enter {
    animation: artifactEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* FAQ underline draw */
  .faq-active-q::after {
    content: "";
    display: block;
    width: 100%;
    height: 2px;
    background: var(--amber);
    margin-top: 6px;
    transform-origin: left;
    animation: underlineDraw 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes underlineDraw {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  /* Walkthrough progress bar */
  .progress-dot {
    width: 12px; height: 12px; border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--paper);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
    flex-shrink: 0;
  }
  .progress-dot.done { background: var(--ink); border-color: var(--ink); }
  .progress-dot.current { background: var(--amber); border-color: var(--amber); transform: scale(1.3); }
  .progress-dot.gate-dot { border-radius: 2px; transform: rotate(45deg); }
  .progress-dot.gate-dot.done { background: var(--ink); border-color: var(--ink); transform: rotate(45deg); }
  .progress-dot.gate-dot.current { background: var(--amber); border-color: var(--amber); transform: rotate(45deg) scale(1.3); }
  .progress-line {
    flex: 1; height: 2px; background: var(--line);
  }
  .progress-line.done { background: var(--ink); }

  /* Hero drift-and-converge animation */
  @keyframes heroDriftIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes heroCardDrift {
    0% { opacity: 0; transform: var(--drift-from); }
    100% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes heroConnectorDraw {
    0% { stroke-dashoffset: 200; opacity: 0; }
    30% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  @keyframes heroPulse {
    0%, 100% { opacity: 0.4; transform: scale(0.95); }
    50% { opacity: 0.7; transform: scale(1.05); }
  }
  @keyframes heroLabelFade {
    0% { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: none; }
  }
  .hero-visual {
    animation: heroDriftIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
  }
  .hero-card {
    animation: heroCardDrift 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .hero-card-1 { --drift-from: translate(-30px, 20px) rotate(-6deg); animation-delay: 0.15s; }
  .hero-card-2 { --drift-from: translate(25px, -25px) rotate(5deg); animation-delay: 0.25s; }
  .hero-card-3 { --drift-from: translate(-20px, -30px) rotate(-4deg); animation-delay: 0.35s; }
  .hero-connector {
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: heroConnectorDraw 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
  }
  .hero-center-pulse {
    animation: heroPulse 3s ease-in-out infinite;
    animation-delay: 1s;
  }
  .hero-label {
    animation: heroLabelFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .hero-label-1 { animation-delay: 0.25s; }
  .hero-label-2 { animation-delay: 0.35s; }
  .hero-label-3 { animation-delay: 0.45s; }
  .hero-label-center { animation-delay: 0.65s; }

  @media (max-width: 767px) {
    .hero-visual-container { display: none; }
  }

  /* Role selector animations */
  @keyframes roleSelectorEntry {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes roleGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(184,90,31,0.0); }
    50% { box-shadow: 0 0 16px 4px rgba(19,62,248,0.10); }
  }
  @keyframes rolePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  .role-selector {
    animation: roleSelectorEntry 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
  }
  .role-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 16px 20px;
    border: 2px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    min-width: 130px;
    text-align: center;
    animation: roleGlow 2.5s ease-in-out infinite, rolePulse 3s ease-in-out infinite;
  }
  .role-btn:hover {
    border-color: var(--amber);
    transform: scale(1.05);
    box-shadow: 0 4px 20px rgba(19,62,248,0.12);
    animation: none;
  }
  .role-btn.selected {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--paper);
    animation: none;
    transform: scale(1);
    box-shadow: 0 2px 8px rgba(36,31,32,0.12);
  }
  .role-btn.dimmed {
    opacity: 0.5;
    animation: none;
    transform: scale(0.97);
  }
  .role-btn.dimmed:hover {
    opacity: 1;
    transform: scale(1.03);
  }

  /* Progressive reveal skeleton shimmer */
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes sectionFadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .section-skeleton {
    height: 120px;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--paper-2) 25%, var(--paper-3) 50%, var(--paper-2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
  }
  .section-enter {
    animation: sectionFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Terminal line stagger */
  @keyframes termLineIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }
  .term-line-stagger > div {
    opacity: 0;
    animation: termLineIn 0.2s ease forwards;
  }

  /* Active command dot pulse */
  @keyframes cmdDotPulse {
    0%, 100% { r: 14; opacity: 1; }
    50% { r: 18; opacity: 0.3; }
  }
  .cmd-dot-pulse {
    animation: cmdDotPulse 2s ease-in-out infinite;
  }

  /* SVG path draw-in animation */
  @keyframes svgPathDraw {
    from { stroke-dashoffset: var(--path-length, 200); opacity: 0; }
    10% { opacity: 1; }
    to { stroke-dashoffset: 0; opacity: 1; }
  }
  .reveal.show .svg-draw-path {
    stroke-dasharray: var(--path-length, 200);
    stroke-dashoffset: var(--path-length, 200);
    animation: svgPathDraw 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .reveal.show .svg-draw-path:nth-child(1) { animation-delay: 0.2s; }
  .reveal.show .svg-draw-path:nth-child(2) { animation-delay: 0.35s; }
  .reveal.show .svg-draw-path:nth-child(3) { animation-delay: 0.5s; }

  /* FAQ smooth height transition */
  .faq-answer {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    opacity: 0;
  }
  .faq-answer.open {
    grid-template-rows: 1fr;
    opacity: 1;
  }
  .faq-answer > div {
    overflow: hidden;
  }

  @media print {
    .stickynav { display: none; }
  }
</style>
</head>

function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("show"); });
    }, { threshold: 0.08 });
    const scan = () => document.querySelectorAll(".reveal:not(.show)").forEach(el => io.observe(el));
    scan();
    const mo = new MutationObserver(scan);
    mo.observe(document.body, { childList: true, subtree: true });
    return () => { io.disconnect(); mo.disconnect(); };
  }, []);
}

function useActiveSection(ids) {
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: "-40% 0px -55% 0px" });
    ids.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, [ids]);
  return active;
}

/* Inline code formatter — wraps /speckit.* and spec.md / plan.md / tasks.md in code font */
const Fmt = ({ children }) => {
  if (typeof children !== "string") return children;
  const parts = children.split(/(\/speckit\.\w+|spec\.md|plan\.md|tasks\.md|constitution\.md)/g);
  return parts.map((p, i) =>
    /^\/speckit\.|\.md$/.test(p)
      ? <code key={i} className="mono text-amber" style={{ fontSize: "0.9em" }}>{p}</code>
      : p
  );
};

/* ----- Command Sequence Timeline (Section 04) ----- */
const CommandTimeline = ({ active, onSelect }) => {
  const cmds = [
    { id: "constitution", short: "constitution", phase: "spec" },
    { id: "specify", short: "specify", phase: "spec" },
    { id: "clarify", short: "clarify", phase: "spec" },
    { id: "plan", short: "plan", phase: "eng" },
    { id: "tasks", short: "tasks", phase: "eng" },
    { id: "implement", short: "implement", phase: "eng" },
  ];
  const dotR = 14, gap = 100, padX = 30;
  const w = padX * 2 + cmds.length * dotR * 2 + (cmds.length - 1) * gap;
  const topPad = 14; // space for phase labels
  return (
    <div className="reveal mb-8 overflow-x-auto">
      <svg viewBox={`0 0 ${w} ${62 + topPad}`} width="100%" style={{ maxWidth: w, minWidth: 480 }} xmlns="http://www.w3.org/2000/svg">
        {cmds.map((c, i) => {
          const cx = padX + dotR + i * (dotR * 2 + gap);
          const cy = 22 + topPad;
          const isActive = active === c.id;
          const isGate = i === 3 || i === 5;
          const phaseColor = c.phase === "eng" ? "var(--sage)" : "var(--amber)";
          return (
            <g key={i} style={{ cursor: "pointer" }} onClick={() => onSelect(c.id)}>
              {i > 0 && <line x1={cx - gap - dotR + 2} y1={cy} x2={cx - dotR - 2} y2={cy} stroke="var(--line)" strokeWidth={1.5} />}
              {isGate && i > 0 && <text x={cx - gap/2 - dotR + 2} y={cy - 14} textAnchor="middle" fill="var(--amber)" fontSize={7} fontFamily="JetBrains Mono, monospace">GATE</text>}
              {isActive && <circle cx={cx} cy={cy} r={dotR} fill="none" stroke={phaseColor} strokeWidth={1.5} className="cmd-dot-pulse" opacity={0.5} />}
              <circle cx={cx} cy={cy} r={dotR} fill={isActive ? "var(--ink)" : "var(--paper-2)"} stroke={isActive ? "var(--ink)" : "var(--line)"} strokeWidth={1.5} />
              <text x={cx} y={cy + 4} textAnchor="middle" fill={isActive ? "var(--paper)" : "var(--ink-3)"} fontSize={10} fontFamily="JetBrains Mono, monospace" fontWeight={600}>{i + 1}</text>
              <text x={cx} y={cy + 30} textAnchor="middle" fill={isActive ? phaseColor : "var(--ink-3)"} fontSize={9} fontFamily="JetBrains Mono, monospace" fontWeight={isActive ? 600 : 400}>{c.short}</text>
            </g>
          );
        })}
        {/* Phase labels */}
        <text x={padX + dotR + 1 * (dotR * 2 + gap)} y={10} textAnchor="middle" fill="var(--amber)" fontSize={8} fontFamily="Inter, sans-serif" opacity={0.6}>spec phase</text>
        <text x={padX + dotR + 4 * (dotR * 2 + gap)} y={10} textAnchor="middle" fill="var(--sage)" fontSize={8} fontFamily="Inter, sans-serif" opacity={0.6}>implementation phase</text>
      </svg>
    </div>
  );
};

/* ----- Progressive Reveal Wrapper ----- */
const ProgressiveReveal = ({ children }) => {
  const items = React.Children.toArray(children).filter(Boolean);
  const [revealed, setRevealed] = useState(0);

  useEffect(() => {
    if (revealed >= items.length) return;
    const timer = setTimeout(() => setRevealed(r => r + 1), 80);
    return () => clearTimeout(timer);
  }, [revealed, items.length]);

  return (
    <div>
      {items.map((child, i) => (
        <div key={i} className={i < revealed ? "section-enter" : ""} style={{
          opacity: i < revealed ? undefined : 0,
          animationDelay: `${i * 0.05}s`
        }}>
          {i < revealed ? child : <div className="section-skeleton mx-6 md:mx-10 my-8" style={{ maxWidth: "64rem", margin: "2rem auto" }} />}
        </div>
      ))}
    </div>
  );
};

const CheckpointsSection = () => (
  <Section
    id="checkpoints"
    eyebrow="Checkpoints"
    title="Where the gates are. Who opens them."
    lede="Three checkpoints matter most. Approve the spec. Approve the plan. Approve the code. The rest follows."
  >
    <div className="grid md:grid-cols-12 gap-8 mt-4">
      <div className="md:col-span-8 reveal">
        {CHECKPOINT_PHASES.map((phase, pi) => (
          <div key={pi} className={pi > 0 ? "mt-8" : ""}>
            <div className="flex items-center gap-3 mb-4">
              <div style={{ width: 8, height: 8, borderRadius: 2, background: phase.color }} />
              <span className="mono text-xs uppercase tracking-wider" style={{ color: phase.color }}>{phase.label}</span>
              <div className="flex-1 h-px" style={{ background: phase.color, opacity: 0.2 }} />
            </div>
            <div className="space-y-1">
              {phase.items.map(i => {
                const c = CHECKPOINTS[i];
                return (
                  <div key={i} className={`checkpoint ${c.gate ? "gate" : ""}`}>
                    <div className="flex items-baseline gap-3 mb-1">
                      <span className="mono text-xs num text-ink-faint">{(i+1).toString().padStart(2,"0")}</span>
                      <span className={`text-base ${c.gate ? "text-amber font-medium" : "text-ink"}`}>{c.stage}</span>
                      {c.gate && <span className="chip chip-amber" style={{ fontSize: 9 }}>GATE</span>}
                    </div>
                    <div className="text-sm text-ink-3 ml-6">
                      <div>{c.who}</div>
                      <div className="mt-1 text-ink-faint">→ {c.out}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      <div className="md:col-span-4 reveal">
        <div className="card p-6 sticky" style={{ top: 24 }}>
          <Eyebrow>The three gates</Eyebrow>
          <ol className="mt-4 space-y-4 text-sm text-ink-2 leading-relaxed">
            <li>
              <strong className="text-ink">Spec MR approval</strong> — PO and Tech lead agree on what is being built.
            </li>
            <li>
              <strong className="text-ink">Plan / architecture review</strong> — Tech lead (or software architect if cross-cutting).
            </li>
            <li>
              <strong className="text-ink">Code review</strong> — your existing peer review, unchanged.
            </li>
          </ol>
          <p className="mt-5 text-xs text-ink-3 italic">Nothing proceeds without human sign-off. The AI never bypasses a gate.</p>
        </div>
      </div>
    </div>
  </Section>
);

/* ----- Walkthrough ----- */
const WalkthroughSection = () => {
  const [step, setStep] = useState(0);
  const cur = WALKTHROUGH[step];
  return (
    <Section
      id="walkthrough"
      eyebrow="Live example — feature 042"
      title="One feature, end to end."
      lede="A real-shaped example: 'send an SMS confirmation when an order ships'. A small feature, single-domain, no cross-cutting drama. The full nine steps, with what each step actually produces."
    >
      {/* Progress bar */}
      <div className="reveal flex items-center gap-0 mb-10 px-2 overflow-x-auto">
        {WALKTHROUGH.map((s, i) => {
          const isGate = [3, 4, 7, 8].includes(i);
          const cls = i < step ? "done" : i === step ? "current" : "";
          return (
            <React.Fragment key={i}>
              <div
                onClick={() => setStep(i)}
                className={`progress-dot ${cls} ${isGate ? "gate-dot" : ""}`}
                title={s.title}
              />
              {i < WALKTHROUGH.length - 1 && (
                <div className={`progress-line ${i < step ? "done" : ""}`} />
              )}
            </React.Fragment>
          );
        })}
      </div>

      <div className="reveal grid md:grid-cols-12 gap-8 mt-4">
        <div className="md:col-span-4">
          <div className="space-y-1">
            {WALKTHROUGH.map((s, i) => (
              <button
                key={i}
                onClick={() => setStep(i)}
                className={`w-full text-left p-3 transition-all flex items-baseline gap-3 ${i === step ? "border-l-2 border-amber bg-paper-2" : "border-l-2 border-transparent hover:bg-paper-2"}`}
              >
                <span className="mono text-xs num text-ink-faint shrink-0 w-6">{(i+1).toString().padStart(2,"0")}</span>
                <div className="min-w-0">
                  <div className={`text-sm ${i === step ? "text-ink font-medium" : "text-ink-2"}`}>{s.title}</div>
                  <div className="text-xs text-ink-faint mt-0.5">{s.phase}</div>
                </div>
              </button>
            ))}
          </div>
          <div className="mt-6 flex gap-2">
            <button onClick={() => setStep(Math.max(0, step-1))} className="btn" disabled={step === 0}>← Prev</button>
            <button onClick={() => setStep(Math.min(WALKTHROUGH.length-1, step+1))} className="btn btn-primary" disabled={step === WALKTHROUGH.length-1}>Next →</button>
          </div>
        </div>

        <div className="md:col-span-8">
          <div key={step} className="walkthrough-enter">
            <div className="flex items-baseline gap-3 mb-3">
              <span className="mono text-amber text-xs num">STEP {(step+1).toString().padStart(2,"0")} / {WALKTHROUGH.length.toString().padStart(2,"0")}</span>
              <span className="text-ink-faint text-xs mono uppercase tracking-wider">{cur.actor}</span>
            </div>
            <h3 className="display text-3xl text-ink mb-3">{cur.title}</h3>
            <p className="text-ink-2 leading-relaxed mb-6 max-w-2xl">{cur.desc}</p>

            {cur.artifact && <Artifact a={cur.artifact} />}

            {cur.note && (
              <p className="mt-6 text-sm text-ink-3 italic" style={{ borderLeft: "2px solid var(--line)", paddingLeft: 14 }}>
                {cur.note}
              </p>
            )}
          </div>
        </div>
      </div>
    </Section>
  );
};

const Artifact = ({ a }) => {
  if (a.type === "term") {
    return (
      <div className="codeblock">
        {a.lines.map(([cls, txt], i) => (
          <div key={i} className={cls || ""}>{txt || "\u00A0"}</div>
        ))}
      </div>
    );
  }
  if (a.type === "story") {
    return (
      <div className="card p-6" style={{ background: "var(--paper)" }}>
        <div className="chip mb-3" style={{ fontSize: 10 }}>JIRA STORY</div>
        <div className="text-ink font-medium mb-3">{a.title}</div>
        <div className="text-sm text-ink-2 mb-4">
          <strong>{a.role}</strong>, <span>{a.want}</span>, <span>{a.so}.</span>
        </div>
        <Eyebrow>Acceptance criteria</Eyebrow>
        <ul className="mt-2 space-y-1.5 text-sm text-ink-2">
          {a.ac.map((x, i) => <li key={i} className="flex gap-2"><span className="text-ink-faint">·</span><span>{x}</span></li>)}
        </ul>
      </div>
    );
  }
  if (a.type === "qa") {
    return (
      <div className="space-y-3">
        {a.pairs.map(([q, ans], i) => (
          <div key={i} className="grid grid-cols-12 gap-3 items-start">
            <div className="col-span-5 card p-3 text-sm" style={{ background: "var(--paper-2)" }}>
              <div className="mono text-xs uppercase mb-1 text-ink-faint">AI asks</div>
              <div className="text-ink-2">{q}</div>
            </div>
            <div className="col-span-1 text-center text-amber">→</div>
            <div className="col-span-6 card p-3 text-sm" style={{ borderColor: "var(--amber)", background: "rgba(19,62,248,0.04)" }}>
              <div className="mono text-xs uppercase mb-1 text-amber">Team answers</div>
              <div className="text-ink">{ans}</div>
            </div>
          </div>
        ))}
      </div>
    );
  }
  if (a.type === "mr") {
    return (
      <div className="card p-5">
        <div className="flex items-center gap-2 text-xs mono uppercase tracking-wider text-sage mb-3">
          <span className="dot" style={{ background: "var(--sage)" }}></span>
          GitLab MR · ready for review
        </div>
        <div className="text-ink mb-3 font-medium">{a.title}</div>
        <div className="text-xs text-ink-3 mb-4">Reviewers: {a.reviewers.join(", ")}</div>
        <div className="space-y-1.5 text-sm text-ink-2">
          {a.checks.map((c, i) => <div key={i} className="flex gap-2"><span className="text-sage">✓</span>{c}</div>)}
        </div>
      </div>
    );
  }
  if (a.type === "tasks") {
    return (
      <div className="codeblock">
        <div className="dim mb-3"># tasks.md</div>
        {a.items.map(([t, p, desc], i) => (
          <div key={i} className="flex gap-3 mb-1">
            <span className="dim">[ ]</span>
            <span className="cmd">{t}</span>
            {p && <span className="ok">{p}</span>}
            <span>{desc}</span>
          </div>
        ))}
      </div>
    );
  }
  return null;
};

/* ----- Roles ----- */

        <div className="card p-7 mb-8" style={{ borderLeft: "3px solid var(--amber)" }}>

      <div className="reveal grid md:grid-cols-2 gap-8">
        <div>
          <Eyebrow>What you own</Eyebrow>
          <ul className="mt-4 space-y-3">
            {role.owns.map((o, i) => (
              <li key={i} className="flex gap-3 text-ink-2 leading-relaxed text-sm">
                <span className="mono text-amber text-xs num pt-0.5">{(i+1).toString().padStart(2,"0")}</span>
                <span><Fmt>{o}</Fmt></span>
              </li>
            ))}
          </ul>
        </div>

        <div>
          <Eyebrow>What you hand over</Eyebrow>
          <ul className="mt-4 space-y-3">
            {role.handsOver.map((o, i) => (
              <li key={i} className="flex gap-3 text-ink-2 leading-relaxed text-sm">
                <span className="text-amber pt-0.5">→</span>
                <span><Fmt>{o}</Fmt></span>
              </li>
            ))}
          </ul>
        </div>
      </div>

      <div className="reveal mt-8 grid md:grid-cols-2 gap-8">
        <div>
          <Eyebrow>What really changes</Eyebrow>
          <p className="mt-3 text-ink-2 leading-relaxed text-sm"><Fmt>{role.reallyChanges}</Fmt></p>
        </div>
        <div>
          <Eyebrow>You keep doing</Eyebrow>
          <div className="mt-3 flex flex-wrap gap-2">
            {role.keepDoing.map((k, i) => (
              <span key={i} className="chip chip-sage">{k}</span>
            ))}
          </div>
        </div>
      </div>
    </Section>
  );
};

/* ----- FAQ ----- */
const FAQS = [
  {
    q: "What if the AI hallucinates something?",
    a: "It will, sometimes. That is why every step has a human gate. Clarification catches ambiguity before code. The plan goes through architect/Tech lead review. Tasks are reviewed before implementation. Each commit is reviewed before merge. The point is to give humans better artifacts to judge — not to remove them from the loop.",
    roles: ["ba", "po", "ux", "eng", "sa"]
  },
  {
    q: "How do engineers work with SDD?",
    a: "Engineers own the technical side: /speckit.plan, /speckit.tasks, and /speckit.implement. They move from translation work to architecture and review. The interesting parts of the job get more time; the boilerplate gets less. Tech leads in particular shift toward being the trusted reviewers of generated plans for their domain.",
    roles: ["sa"]
  },
  {
    q: "Are we replacing BAs or POs?",
    a: "No. SDD gives business intent a place to live that does not rot. BAs spend less time translating stories into sub-tasks — that step gets automated. They spend more time on discovery, edge cases, and stakeholders. Same for POs.",
    roles: ["ba", "po", "ux", "eng", "sa"]
  },
  {
    q: "How does this work across many repos?",
    a: "One spec per feature. If a feature is single-domain, the spec lives in that repository. If it spans multiple repos (for example, a notification feature across several services), the spec often lives in a shared architecture folder for cross-cutting design. Link merge requests by feature number (042-...) across repos in your organization.",
    roles: ["eng", "sa"]
  },
  {
    q: "Will this slow us down at first?",
    a: "Yes. The first 2-3 features will feel slower because the team is learning a new flow. After that, single features get faster (less back-and-forth on Teams), and pivots get dramatically faster (regenerate the plan in a morning instead of rewriting it over a week).",
    roles: ["ba", "po", "ux", "eng", "sa"]
  },
  {
    q: "What happens to existing Confluence pages and Jira tickets?",
    a: "They stay where they are. Teams typically do not retroactively migrate. New features use SDD. When an older feature changes materially, extract a spec into the repository as part of that work.",
    roles: ["ba", "po", "ux", "eng", "sa"]
  },
  {
    q: "Do BAs / POs / designers need to learn the slash commands?",
    a: "BAs learn /speckit.specify and /speckit.clarify — these are the commands that turn a Jira story into a structured spec. UI/UX designers learn the same two commands for frontend features. POs review the outputs in GitLab and don't need to run commands. Engineers handle /speckit.plan, /speckit.tasks, and /speckit.implement.",
    roles: ["ba", "po", "ux"]
  },
  {
    q: "Do I need to learn Git?",
    a: "A short crash course in Git basics will be necessary — branching, commits, merge requests. Claude Code handles most of the git operations for you (creating branches, committing), but you need to understand what is happening so you can review confidently in GitLab. Think of it as learning to read a map, not drive the car.",
    roles: ["ba", "po", "ux"]
  }
];

const FAQSection = ({ role }) => {
  const filtered = role ? FAQS.filter(f => f.roles.includes(role)) : FAQS;
  const [open, setOpen] = useState(0);
  return (
    <Section
      id="faq"
      eyebrow="FAQ"
      title="Questions you are already asking."
    >
      <div className="reveal mt-4">
        {filtered.map((f, i) => (
          <div key={f.q} className="border-b border-line">
            <button onClick={() => setOpen(open === i ? -1 : i)} className="w-full text-left py-6 flex justify-between items-baseline gap-4 group">
              <span className={`text-ink display text-lg md:text-xl group-hover:text-amber transition-colors text-left ${open === i ? "faq-active-q" : ""}`}>{f.q}</span>
              <span className="text-amber text-2xl shrink-0 transition-transform" style={{ transform: open === i ? "rotate(45deg)" : "none" }}>+</span>
            </button>
            <div className={`faq-answer ${open === i ? "open" : ""}`}>
              <div>
                <div className="pb-8 text-ink-2 leading-relaxed max-w-3xl"><Fmt>{f.a}</Fmt></div>
              </div>
            </div>
          </div>
        ))}
      </div>
    </Section>
  );
};
