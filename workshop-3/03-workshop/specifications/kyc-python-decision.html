<script type="text/babel">

const COMPARISON = [

const DECISION_REASONS = [

    text: "Customer identity, document metadata, compliance checks, risk scoring, and error responses can be expressed clearly with typed Pydantic models and Decimal-safe fields."

const NEXT_STEPS = [

  "Add authentication, audit logging, document verification, and compliance services.",

  "Preserve the Java decision as an alternative in documentation, not as an active implementation path."
];

function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("show");
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function useActiveSection(ids) {
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    }, { rootMargin: "-40% 0px -55% 0px" });
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, [ids]);
  return active;
}

          <div className="mono text-xs num text-amber mb-3">0{i + 1}</div>
          <div className="display text-2xl text-ink mb-3">{reason.title}</div>
          <p className="text-sm text-ink-2 leading-relaxed">{reason.text}</p>
        </div>
      ))}
    </div>

    <div className="reveal mt-10 p-6 border border-line rounded-lg bg-paper">
      <Eyebrow color="var(--amber)">Decision statement</Eyebrow>
      <p className="display text-2xl md:text-3xl leading-snug text-ink mt-4">
        We will implement the KYC API in <span className="marker-amber">Python 3.12+ with FastAPI</span>,
        using Pydantic for data validation, pydantic-settings for configuration, pytest for integration tests,
        and Schemathesis for OpenAPI contract testing.
      </p>
    </div>
  </Section>
);

const ImplicationsSection = () => (
  <Section
    id="implications"
    wide
    eyebrow="Implementation impact"
    title="Selecting Python keeps the low-level task plan intact."
    lede="The project can proceed from the current specification without converting file targets, framework choices, validation approach, or test strategy."
  >
    <div className="grid md:grid-cols-12 gap-8">
      <div className="md:col-span-7 reveal">
        <div className="space-y-3">
          {IMPLEMENTATION_MAP.map(([area, detail], i) => (
            <div key={area} className="flex gap-4 p-4 card">
              <span className="mono text-xs num text-ink-faint w-7 flex-shrink-0">{String(i + 1).padStart(2, "0")}</span>
              <div>
                <div className="font-medium text-ink">{area}</div>
                <div className="text-sm text-ink-2 leading-relaxed mt-1">{detail}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="md:col-span-5 reveal">
        <div className="card card-strong p-6 sticky" style={{ top: 24 }}>
          <Eyebrow color="var(--amber)">What changes?</Eyebrow>
          <p className="mt-4 text-sm text-ink-2 leading-relaxed">
            Nothing needs to change in the core project direction. Python confirms the current plan:
            OpenAPI first, FastAPI endpoints, Pydantic validation, contract tests, JWT auth, audit logging,
            and phased Azure deployment.
          </p>
          <div className="mt-6 pt-5" style={{ borderTop: "1px dashed var(--amber)" }}>
            <Eyebrow color="var(--rust)">What would Java require?</Eyebrow>
            <p className="mt-4 text-sm text-ink-2 leading-relaxed">
              A Java path would require rewriting the specification around Spring Boot controllers,
              Java DTOs or records, Jakarta Bean Validation, Spring Security, JUnit, REST Assured,
              and a Maven or Gradle Docker build.
            </p>
          </div>
        </div>
      </div>
    </div>
  </Section>
);

const NextStepsSection = () => (
  <Section
    id="next"
    eyebrow="Next steps"
    title="Move from decision to implementation."
    lede="The technology decision is now settled. The next project step is to generate the OpenAPI contract and implement the Python service around it."
  >
    <div className="grid md:grid-cols-12 gap-8">
      <div className="md:col-span-6 reveal">
        <div className="space-y-0">
          {NEXT_STEPS.map((step, i) => (
            <div key={step} className={`timeline-item ${i === 0 ? "selected" : ""}`}>
              <div className="mono text-xs text-ink-faint mb-1">STEP {String(i + 1).padStart(2, "0")}</div>
              <div className="text-sm text-ink-2 leading-relaxed">{step}</div>
            </div>
          ))}
        </div>
      </div>
      <div className="md:col-span-6 reveal">
        <div className="codeblock">
          <div><span className="dim"># Python implementation baseline</span></div>
          <div><span className="cmd">CREATE</span> specs/kyc-api.yaml</div>
          <div><span className="cmd">CREATE</span> src/models.py</div>
          <div><span className="cmd">CREATE</span> src/api.py</div>
          <div><span className="cmd">CREATE</span> src/auth.py</div>
          <div><span className="cmd">CREATE</span> tests/contract_tests.py</div>
          <div><span className="cmd">CREATE</span> tests/test_kyc_api.py</div>
          <div><span className="ok">KEEP</span> Python as the source implementation stack</div>
        </div>
      </div>
    </div>
  </Section>
);

const Footer = () => (
  <footer className="py-10">
    <div className="max-w-5xl mx-auto px-6 md:px-10 flex flex-col md:flex-row justify-between gap-4 text-xs text-ink-faint mono">
      <span>KYC API technology decision</span>
      <span>Python / FastAPI selected for this specification</span>
    </div>
  </footer>
);

function App() {
  useReveal();
  const active = useActiveSection(NAV.map(item => item.id));
  return (
    <div className="relative">
      <Nav active={active} />
      <Header />
      <Opening />
      <ContextSection />
      <AlternativesSection />
      <ComparisonSection />
      <WhyPythonSection />
      <ImplicationsSection />
      <NextStepsSection />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
